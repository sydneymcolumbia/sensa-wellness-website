<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0080"/>
      <stop offset="0.45" stop-color="#1800ad"/>
      <stop offset="1" stop-color="#3a2de0"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="0.85" cy="0.12" r="0.5">
      <stop offset="0" stop-color="#fac234" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fac234" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.12" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#41a6f0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#41a6f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8860b"/>
      <stop offset="0.35" stop-color="#fac234"/>
      <stop offset="0.6" stop-color="#ffe9a8"/>
      <stop offset="1" stop-color="#d09a10"/>
    </linearGradient>
    <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fac234"/>
      <stop offset="1" stop-color="#a87708"/>
    </linearGradient>
    <linearGradient id="grille" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#23146e"/>
      <stop offset="0.5" stop-color="#4a3ac2"/>
      <stop offset="1" stop-color="#1c0e63"/>
    </linearGradient>
    <clipPath id="headClip">
      <rect x="462" y="178" width="276" height="392" rx="138"/>
    </clipPath>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" fill="url(#glowGold)"/>
  <rect width="1200" height="1200" fill="url(#glowBlue)"/>

  <circle cx="600" cy="380" r="290" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>
  <circle cx="600" cy="380" r="360" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="2"/>
  <circle cx="600" cy="380" r="430" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="2"/>

  <!-- radio waves -->
  <g stroke="#fac234" stroke-width="9" fill="none" stroke-linecap="round">
    <path d="M 382 322 A 82 82 0 0 0 382 438" opacity="0.9"/>
    <path d="M 332 292 A 132 132 0 0 0 332 468" opacity="0.5"/>
    <path d="M 282 262 A 182 182 0 0 0 282 498" opacity="0.25"/>
    <path d="M 818 322 A 82 82 0 0 1 818 438" opacity="0.9"/>
    <path d="M 868 292 A 132 132 0 0 1 868 468" opacity="0.5"/>
    <path d="M 918 262 A 182 182 0 0 1 918 498" opacity="0.25"/>
  </g>

  <!-- stand -->
  <path d="M 578 560 L 622 560 L 632 700 L 568 700 Z" fill="url(#goldV)"/>
  <rect x="583" y="695" width="34" height="180" rx="8" fill="url(#gold)"/>
  <path d="M 560 868 L 640 868 L 700 920 L 500 920 Z" fill="url(#goldV)"/>
  <ellipse cx="600" cy="920" rx="120" ry="22" fill="#8a6508"/>
  <ellipse cx="600" cy="912" rx="120" ry="22" fill="url(#gold)"/>

  <!-- microphone head -->
  <rect x="450" y="166" width="300" height="416" rx="150" fill="url(#grille)"/>
  <g clip-path="url(#headClip)">
    <g stroke="#9aa4ff" stroke-opacity="0.55" stroke-width="5">
      <line x1="462" y1="222" x2="738" y2="222"/>
      <line x1="462" y1="254" x2="738" y2="254"/>
      <line x1="462" y1="286" x2="738" y2="286"/>
      <line x1="462" y1="318" x2="738" y2="318"/>
      <line x1="462" y1="350" x2="738" y2="350"/>
      <line x1="462" y1="382" x2="738" y2="382"/>
      <line x1="462" y1="414" x2="738" y2="414"/>
      <line x1="462" y1="446" x2="738" y2="446"/>
      <line x1="462" y1="478" x2="738" y2="478"/>
      <line x1="462" y1="510" x2="738" y2="510"/>
      <line x1="462" y1="542" x2="738" y2="542"/>
    </g>
    <rect x="586" y="178" width="28" height="392" fill="url(#gold)"/>
  </g>
  <rect x="450" y="166" width="300" height="416" rx="150" fill="none" stroke="url(#gold)" stroke-width="12"/>

  <!-- center badge -->
  <circle cx="600" cy="374" r="74" fill="#0d0080" stroke="url(#gold)" stroke-width="8"/>
  <text x="600" y="362" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="40" font-weight="bold" fill="#fac234">94.9</text>
  <text x="600" y="404" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="bold" letter-spacing="4" fill="#ffffff">FM</text>

  <!-- side screws -->
  <circle cx="450" cy="374" r="14" fill="url(#gold)"/>
  <circle cx="750" cy="374" r="14" fill="url(#gold)"/>

  <!-- text -->
  <text x="600" y="1022" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="92" font-weight="bold" letter-spacing="20" fill="#ffffff">DISCOVERY</text>
  <text x="600" y="1082" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="36" font-weight="bold" fill="#fac234">with Tim Potter &#183; WZMR 94.9 FM Boston</text>
  <rect x="480" y="1108" width="240" height="4" rx="2" fill="#fac234" opacity="0.5"/>
  <text x="600" y="1156" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="32" fill="#ffffff" fill-opacity="0.85">featuring Ryan Robinson &#183; Sensa Wellness</text>
</svg>
